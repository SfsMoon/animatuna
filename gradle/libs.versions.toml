[versions]
agp = "9.3.1"
# The modern Xposed API that Vector (JingMatrix/Vector) implements.
libxposed = "102.0.0"
junit = "4.13.2"

[plugins]
agp-app = { id = "com.android.application", version.ref = "agp" }

[libraries]
# Hook side: the framework provides it at run time.
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposed" }
# App side: reaches the framework to store settings the hook side reads.
libxposed-service = { group = "io.github.libxposed", name = "service", version.ref = "libxposed" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
